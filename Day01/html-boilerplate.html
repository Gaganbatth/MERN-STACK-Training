<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Boilerplate</title>
  </head>
  <body>
    <h1>HTML Boilerplate</h1>

    <p>This webpage demonstrates the basic structure of an HTML document.</p>

    <h2>HTML Structure</h2>

    <ul>
      <li>&lt;!DOCTYPE html&gt; - Declares HTML5 document.</li>
      <li>&lt;html&gt; - Root element.</li>
      <li>&lt;head&gt; - Stores metadata.</li>
      <li>&lt;title&gt; - Browser tab title.</li>
      <li>&lt;body&gt; - Visible webpage content.</li>
    </ul>
  </body>
</html>
