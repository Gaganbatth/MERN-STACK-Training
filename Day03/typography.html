<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Typography</title>

    <style>
      h1 {
        color: navy;
        text-align: center;
      }

      .p1 {
        font-size: 30px;
      }

      .p2 {
        font-family: Verdana;
      }

      .p3 {
        font-style: italic;
      }

      .p4 {
        font-weight: bold;
      }

      .p5 {
        text-decoration: underline;
      }

      .p6 {
        text-transform: uppercase;
      }

      .p7 {
        letter-spacing: 5px;
      }

      .p8 {
        word-spacing: 20px;
      }

      .p9 {
        line-height: 40px;
      }
    </style>
  </head>

  <body>
    <h1>Typography Properties</h1>

    <p class="p1">Font Size</p>

    <p class="p2">Font Family</p>

    <p class="p3">Font Style</p>

    <p class="p4">Font Weight</p>

    <p class="p5">Text Decoration</p>

    <p class="p6">Text Transform</p>

    <p class="p7">Letter Spacing</p>

    <p class="p8">Word Spacing Example</p>

    <p class="p9">This paragraph demonstrates line height property.</p>
  </body>
</html>
