<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Transforms</title>

    <style>
      body {
        font-family: Arial;
        text-align: center;
      }

      .container {
        display: flex;
        justify-content: center;
        gap: 30px;
        flex-wrap: wrap;
        margin-top: 50px;
      }

      .box {
        width: 120px;
        height: 120px;
        background: steelblue;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .translate:hover {
        transform: translateY(-30px);
      }

      .rotate:hover {
        transform: rotate(45deg);
      }

      .scale:hover {
        transform: scale(1.3);
      }

      .skew:hover {
        transform: skew(20deg);
      }
    </style>
  </head>

  <body>
    <h1>CSS Transform Demonstration</h1>

    <div class="container">
      <div class="box translate">Translate</div>

      <div class="box rotate">Rotate</div>

      <div class="box scale">Scale</div>

      <div class="box skew">Skew</div>
    </div>
  </body>
</html>
