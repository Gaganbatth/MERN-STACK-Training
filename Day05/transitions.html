<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Transitions</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
      }

      .box {
        width: 200px;
        height: 200px;
        background: royalblue;
        margin: 50px auto;
        line-height: 200px;
        color: white;
        font-size: 22px;

        transition: all 0.6s ease;
      }

      .box:hover {
        background: crimson;
        transform: scale(1.2);
        border-radius: 50%;
      }
    </style>
  </head>

  <body>
    <h1>CSS Transition Demonstration</h1>

    <div class="box">Hover Me</div>
  </body>
</html>
